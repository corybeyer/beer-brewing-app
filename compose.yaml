# Development only. Does not replace /opt/beer-brewing-app/compose.yaml.
name: brewery-development

x-backend: &backend
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: brewery_admin
      POSTGRES_DB: brewery
      POSTGRES_PASSWORD_FILE: /run/secrets/admin-password
    secrets:
      - admin-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewery_admin -d brewery"]
      interval: 3s
      timeout: 3s
      retries: 20

  provision:
    <<: *backend
    command: ["python", "-m", "infrastructure.deployment.database.manage", "provision"]
    environment:
      DATABASE_URL: postgresql://brewery_admin@database:5432/brewery
      DATABASE_PASSWORD_FILE: /run/secrets/admin-password
      MIGRATOR_PASSWORD_FILE: /run/secrets/migrator-password
      APPLICATION_PASSWORD_FILE: /run/secrets/app-password
    secrets:
      - admin-password
      - migrator-password
      - app-password
    healthcheck:
      disable: true
    depends_on:
      database:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["python", "-m", "infrastructure.deployment.database.manage", "migrate"]
    environment:
      DATABASE_URL: postgresql://brewery_migrator@database:5432/brewery
      DATABASE_PASSWORD_FILE: /run/secrets/migrator-password
    secrets:
      - migrator-password
    healthcheck:
      disable: true
    depends_on:
      provision:
        condition: service_completed_successfully

  backend:
    <<: *backend
    environment:
      DATABASE_URL: postgresql://brewery_app@database:5432/brewery
      DATABASE_PASSWORD_FILE: /run/secrets/app-password
    secrets:
      - app-password
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true

secrets:
  admin-password:
    file: ${BREWERY_SECRETS_DIR:-./.secrets}/admin-password
  migrator-password:
    file: ${BREWERY_SECRETS_DIR:-./.secrets}/migrator-password
  app-password:
    file: ${BREWERY_SECRETS_DIR:-./.secrets}/app-password

volumes:
  postgres-data:
