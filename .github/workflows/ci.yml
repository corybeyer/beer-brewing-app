name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install parser dependencies
        run: npm ci
      - name: Check repository policy
        run: python3 scripts/validate_repository.py
      - name: Regression-test validator rules
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_repository_validator.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_pre_pr.py' -v
          node --test tests/unit/frontend_validator.test.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q app.py tests/unit
      - name: Unit tests
        run: |
          python -m unittest discover -s tests/unit -p 'test_health.py' -v
          python -m unittest discover -s tests/unit -p 'test_repository_foundation.py' -v

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: brewery_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: brewery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewery_test -d brewery_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://brewery_test:ephemeral-ci-only@localhost:5432/brewery_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Backend syntax and PostgreSQL tests
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python -m compileall -q apps/api packages/database packages/config infrastructure scripts tests
          python -m unittest discover -s tests -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Type-check and build frontend
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser, component, and accessibility tests
        run: npm test
      - name: Save screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-results
          path: tests/e2e/test-results/

  container-runtime:
    name: Container runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Development stack and production smoke regression
        run: python3 scripts/development/check_containers.py

  candidate-runtime:
    name: Candidate UI and API runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Candidate startup, outage, recovery, and live browser checks
        run: python3 scripts/development/check_containers.py --candidate
      - name: Save serving screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-serving-results
          path: tests/e2e/test-results/

  production-rollout:
    name: Production rollout and verified restore
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disposable adoption, populated restore, and retained-data rollback
        run: python3 -m scripts.development.check_production_rollout

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container for Raspberry Pi ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
      - name: Build development backend for Raspberry Pi ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          platforms: linux/arm64
          push: false
      - name: Build UI and API candidate for Raspberry Pi ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/candidate.Dockerfile
          platforms: linux/arm64
          push: false
