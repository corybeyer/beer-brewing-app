name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q app.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: brewery_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: brewery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewery_test -d brewery_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://brewery_test:ephemeral-ci-only@localhost:5432/brewery_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Backend syntax and PostgreSQL tests
        run: |
          python -m compileall -q app/brewery app/migrations infra/database infra/development tests/backend
          python -m unittest discover -s tests/backend -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container for Raspberry Pi ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
      - name: Build development backend for Raspberry Pi ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/development/Dockerfile
          platforms: linux/arm64
          push: false
