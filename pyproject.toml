[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brewery-companion"
version = "0.1.0"
description = "Local advisory home-brewing backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools]
packages = ["brewery_api", "brewery_database", "brewery_config", "brewery_domain"]

[tool.setuptools.package-dir]
brewery_api = "apps/api/brewery_api"
brewery_database = "packages/database/src/brewery_database"
brewery_config = "packages/config/src/brewery_config"
brewery_domain = "packages/domain/src/brewery_domain"
